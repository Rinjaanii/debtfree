# nginx — реверс-прокси для DebtFree (альтернатива Caddy).
# HTTPS-сертификат получается через certbot (см. DEPLOY.md).
#
# Замените debtfree.example.com на свой домен.
# Файл положите в /etc/nginx/sites-available/debtfree и включите:
#   sudo ln -s /etc/nginx/sites-available/debtfree /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name debtfree.example.com;

    # certbot сам добавит сюда строки сертификата после первого запуска
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name debtfree.example.com;

    # certbot прописывает эти пути при установке сертификата
    ssl_certificate     /etc/letsencrypt/live/debtfree.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/debtfree.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Заголовки, по которым сервер понимает, что запрос шёл по HTTPS,
        # и выдаёт cookie с флагом Secure.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
